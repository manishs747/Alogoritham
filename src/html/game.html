<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
</head>
<body>
<h1>Guess the Number Game</h1>
<p>Pick a number between 1 and 3:</p>

<a href="#wrong">1</a><br>
<a href="#correct">2</a><br>
<a href="#wrong">3</a><br>

<!-- Feedback for wrong guess -->
<div id="wrong" style="margin-top:20px;">
    <h3>Oops! Wrong guess. Try again!</h3>
    <a href="#">Go Back</a>
</div>

<!-- Feedback for correct guess -->
<div id="correct" style="margin-top:20px;">
    <h3>Congratulations! You guessed it right!</h3>
    <a href="#">Play Again</a>
</div>
</body>
</html>
